services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: currency_converter
      POSTGRES_USER: currency
      POSTGRES_PASSWORD: currency
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U currency -d currency_converter"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/currency_converter
      DB_USERNAME: currency
      DB_PASSWORD: currency
      FX_PROVIDER_BASE_URL: ${FX_PROVIDER_BASE_URL:-https://open.er-api.com/v6}
      FX_CACHE_TTL_SECONDS: ${FX_CACHE_TTL_SECONDS:-60}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

volumes:
  db-data:
